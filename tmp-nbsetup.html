<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>임시 확인용 · 노트북 백업 동기화</title>
<style>body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding:24px;background:#fff}pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace}</style>
</head><body>
<h3>임시 확인용 페이지</h3>
<p id="msg">저장본을 넣는 중…</p>
<pre id="out"></pre>
<script>
/* 검증 후 지울 임시 페이지 — 폰처럼 이미 저장본(localStorage)을 둔 기기를 흉내 낸다. */
(function(){
  var msg = document.getElementById('msg'), out = document.getElementById('out');
  var PREV = { bjSynced20261115:1, forumSynced20261116:1, forumPoster20261116:1,
    booksShelfMigrate20261117:1, bookRework20261121:1, libSubToMemo20261121:1,
    ynaSynced20261116:1, ynaSub20261116:1, gradAdm20261117:1, gradAdm20261117b:1,
    bp68Split20261121:1, caseNotes20261117:1, memoHduk20261119:1, memoHudk20261120:1,
    memoHduk20261120:1, mediaTabSplit20261118:1, forumEwha20261118:1, settopSplit20261121:1,
    briefMeet20261118:1, briefMeetMove20261118:1, sort:'default', collapsed:[] };
  fetch('tmp-nbcheck-state.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    localStorage.setItem('eunyu-archive-v1', JSON.stringify(d));
    localStorage.setItem('eunyu-archive-ui-v1', JSON.stringify(PREV));
    localStorage.removeItem('eunyu-archive-sync-v1');
    var books = d.items.filter(function(x){ return x.cat === 'book'; });
    var emp = books.filter(function(x){ return !x.own; }).length;
    msg.textContent = '저장본을 넣었습니다 — 새로고침 한 번으로 노트북과 같아지는지 봅니다.';
    out.textContent = '넣은 저장본: 전체 ' + d.items.length + '건 · 책 ' + books.length +
      '권 (서재 ' + books.filter(function(x){return x.own==='서재';}).length +
      ' · 대여 ' + books.filter(function(x){return x.own==='대여';}).length +
      ' · 미분류 ' + emp + ')';
    setTimeout(function(){ location.replace('./index.html?nbcheck=1'); }, 900);
  }).catch(function(e){ msg.textContent = '실패: ' + e; });
})();
</script>
</body></html>
