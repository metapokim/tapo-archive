<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>sync flow test</title>
<meta name="robots" content="noindex">
<style>body{font:13px/1.6 -apple-system,sans-serif;padding:16px}pre{white-space:pre-wrap}</style>
</head><body>
<h1>동기화 흐름 검증 (임시)</h1>
<pre id="out">running…</pre>
<script>
(function(){
  var GIST_FILE = 'tapo-archive-sync.json';
  var syncCfg = { token: 'bogus_token_for_test_only', gistId: '0123456789abcdef', lastSync: '' };
  var syncBusy = false, syncApplying = false, syncTimer = null;
  function persist(){}
  function render(){}
  function applySyncPayload(){ return false; }
  function buildSyncPayload(){ return { hello: 1 }; }
  function saveSyncCfg(){}
  function ensureDevice(){}
  function syncStatusText(){ setSyncStatus('연결됨'); }
  function toast(m){ log('  toast', m); }
  function setSyncState(s){ log('  state', s); }
  function setSyncStatus(m, c){ log('  status' + (c ? '(' + c + ')' : ''), m); }
  function ghFail(res){
    var e = new Error('http-' + res.status);
    e.status = res.status;
    /* GitHub이 내려주는 실제 에러 message 를 함께 담는다 (403 원인 판별용) */
    return res.text().then(function(txt){
      var obj = null;
      try { obj = JSON.parse(txt); } catch (errJson) { obj = null; }
      if (obj && typeof obj.message === 'string' && obj.message) {
        e.ghMsg = obj.message.replace(/\s+/g, ' ').trim().slice(0, 200);
      }
      throw e;
    }, function(){ throw e; });
  }
  function ghJson(res){
    if (!res.ok) return ghFail(res);
    return res.json();
  }
  /* 어느 단계(조회·생성·저장·원본조회)에서 실패했는지 에러에 표시 */
  function ghTag(p, step){
    return p.catch(function(e){ if (e && !e.step) e.step = step; throw e; });
  }
  function gistText(json){
    var f = json && json.files && json.files[GIST_FILE];
    if (!f) return '';
    if (f.truncated && f.raw_url) {
      return fetch(f.raw_url, { headers: { 'Authorization': 'Bearer ' + syncCfg.token }, cache: 'no-store' })
        .then(function(r){ if (!r.ok) return ghFail(r); return r.text(); })
        .catch(function(e){ if (e && !e.step) e.step = '원본조회'; throw e; });
    }
    return f.content || '';
  }
  function syncErrMsg(err){
    var st = err && err.status, msg;
    if (st === 401) msg = '토큰이 올바르지 않습니다 (gist 권한 확인)';
    else if (st === 403) msg = '권한이 없습니다 (토큰에 gist 권한이 있는지 확인)';
    else if (st === 404) msg = 'Gist ID를 찾을 수 없습니다';
    else if (st === 422) msg = 'Gist 형식 오류 (Gist ID를 다시 확인)';
    else if (st) msg = 'GitHub 오류 (' + st + ')';
    else msg = '네트워크 오류 — 연결을 확인해 주세요';
    var extra = '';
    if (err && err.step) extra += '[' + err.step + '] ';
    if (err && err.ghMsg) extra += 'GitHub: ' + err.ghMsg;
    return extra ? msg + ' · ' + extra : msg;
  }

  function syncNow(opts){
    var silent = !!(opts && opts.silent);
    if (!syncCfg.token) { if (!silent) openSyncModal(); return; }
    if (syncBusy) return;
    syncBusy = true;
    ensureDevice();
    saveSyncCfg();
    setSyncState('busy');
    setSyncStatus('동기화 중…', '');

    var pull = syncCfg.gistId
      ? ghTag(fetch('https://api.github.com/gists/' + encodeURIComponent(syncCfg.gistId),
          { headers: ghHeaders(), cache: 'no-store' }).then(ghJson).then(gistText), '조회')
      : Promise.resolve('');

    pull.then(function(text){
      var remote = null;
      if (text) { try { remote = JSON.parse(text); } catch (e) { remote = null; } }
      syncApplying = true;
      var merged = applySyncPayload(remote);
      if (merged) { persist(); }
      syncApplying = false;
      if (merged) render();

      var content = JSON.stringify(buildSyncPayload(), null, 1);
      if (!syncCfg.gistId) {
        var file = {};
        file[GIST_FILE] = { content: content };
        return ghTag(fetch('https://api.github.com/gists', {
          method: 'POST',
          headers: ghHeaders(),
          body: JSON.stringify({ description: 'TAPO’s archive — 기기 간 동기화 (비공개)', public: false, files: file })
        }).then(ghJson).then(function(json){
          if (json && json.id) { syncCfg.gistId = json.id; saveSyncCfg(); }
          return json;
        }), '생성');
      }
      var files = {};
      files[GIST_FILE] = { content: content };
      return ghTag(fetch('https://api.github.com/gists/' + encodeURIComponent(syncCfg.gistId), {
        method: 'PATCH', headers: ghHeaders(), body: JSON.stringify({ files: files })
      }).then(ghJson), '저장');
    }).then(function(){
      syncCfg.lastSync = new Date().toISOString();
      saveSyncCfg();
      setSyncState('on');
      syncStatusText();
      if (!silent) toast('동기화했습니다');
    }).catch(function(err){
      setSyncState('err');
      var msg = syncErrMsg(err);
      setSyncStatus(msg, 'is-err');
      if (!silent || (err && err.status === 401)) toast('동기화 실패 · ' + msg);
    }).then(function(){ syncBusy = false; });
  }

  var out = [];
  function log(k, v){ out.push(k + ' => ' + v); document.getElementById('out').textContent = out.join('\n'); }
  function res(status, obj){
    return new Response(obj === undefined ? '' : JSON.stringify(obj), {status: status, headers: {'Content-Type':'application/json'}});
  }
  var realFetch = window.fetch;
  function mock(mode){
    window.fetch = function(url, opts){
      var m = (opts && opts.method) || 'GET';
      log('  fetch', m + ' ' + url);
      if (mode === 'all403') return Promise.resolve(res(403, {message:'Resource not accessible by personal access token'}));
      if (mode === 'patch403') return Promise.resolve(m === 'GET' ? res(200, {files: {}}) : res(403, {message:'Resource not accessible by personal access token'}));
      if (mode === 'good') return Promise.resolve(m === 'GET' ? res(200, {files: {}}) : res(200, {id:'abc'}));
      return realFetch(url, opts);
    };
  }
  function step(name, mode){
    log('--- ' + name, '');
    mock(mode);
    var c = {}; c[GIST_FILE] = {};
    syncCfg.gistId = (name.indexOf('생성') >= 0) ? '' : '0123456789abcdef';
    return new Promise(function(done){
      syncNow({ silent: false });
      var t = setInterval(function(){
        if (!syncBusy) { clearInterval(t); setTimeout(done, 20); }
      }, 20);
    });
  }
  step('조회 403', 'all403')
    .then(function(){ return step('저장 403', 'patch403'); })
    .then(function(){ return step('생성 403', 'all403'); })
    .then(function(){ syncCfg.gistId = '0123456789abcdef'; return step('성공', 'good'); })
    .then(function(){ window.fetch = realFetch; log('DONE', 'true'); document.title = 'DONE'; })
    .catch(function(e){ window.fetch = realFetch; log('HARNESS ERROR', e && e.message); document.title = 'DONE'; });
})();
</script>
</body></html>
