<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>임시 390px 확인</title>
<style>
  body{margin:0;background:#DDE3EA;font:13px/1.4 -apple-system,"Apple SD Gothic Neo",sans-serif}
  .wrap{display:flex;gap:18px;padding:14px;align-items:flex-start}
  .box{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .cap{padding:6px 10px;font-weight:700;color:#334155;background:#F1F5F9}
  iframe{display:block;width:390px;height:780px;border:0}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
  /* 이 브라우저 프로필의 저장 상태(카테고리 '메모')를 '전체'로 맞춘 뒤 iframe을 만든다 */
  try {
    localStorage.setItem('eunyu-archive-ui-v1', JSON.stringify({cat:'all', shelf:'all', sort:'default'}));
  } catch (e) {}

  var specs = [
    {cap:'390 · 전체(접힘)', fn:null},
    {cap:'390 · 전체 + ▾ 펼침', fn:function(d){ var m = d.getElementById('topbarMoreBtn'); if (m) m.click(); }},
    {cap:'390 · 책 탭(필터 보임)', fn:function(d){
      var t = d.querySelector('#tabs .tab[data-cat="book"]'); if (t) t.click();
      var m = d.getElementById('topbarMoreBtn'); if (m) m.click();
    }}
  ];
  var wrap = document.getElementById('wrap');
  specs.forEach(function(s, i){
    var box = document.createElement('div'); box.className = 'box';
    var cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = s.cap;
    var f = document.createElement('iframe');
    f.onload = function(){
      setTimeout(function(){
        try { if (s.fn) s.fn(f.contentDocument); }
        catch (e) { cap.textContent += ' ERR:' + e.message; }
      }, 450);
    };
    f.src = './index.html?chk=' + i + '&t=' + Date.now();
    box.appendChild(cap); box.appendChild(f); wrap.appendChild(box);
  });
</script>
</body>
</html>
