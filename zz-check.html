<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>임시 확인(데스크톱·책)</title>
<style>
  body{margin:0;background:#DDE3EA;font:12px/1.4 -apple-system,"Apple SD Gothic Neo",sans-serif}
  .wrap{display:flex;gap:16px;padding:12px;align-items:flex-start}
  .box{background:#fff;border-radius:12px;overflow:hidden}
  .cap{padding:5px 9px;font-weight:700;color:#334155;background:#F1F5F9}
  iframe{display:block;border:0;height:620px;width:390px}
  #d{width:1180px}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
  try { localStorage.setItem('eunyu-archive-ui-v1', JSON.stringify({cat:'all', shelf:'all', sort:'default'})); } catch (e) {}
  function scrollToSel(w, d, sel, pad){
    var el = d.querySelector(sel); if (!el) return;
    var top = el.getBoundingClientRect().top + (d.documentElement.scrollTop || 0);
    w.scrollTo(0, Math.max(0, top - (pad || 70)));
  }
  var specs = [
    {cap:'1180 · 전체(데스크톱) 섹션 머리글', id:'d', fn:function(w, d){ scrollToSel(w, d, '#sections', 80); }},
    {cap:'390 · 책 탭(접기 없음)', fn:function(w, d){
      w.scrollTo(0, 0);
      var t = d.querySelector('#tabs .tab[data-cat="book"]'); if (t) t.click();
      setTimeout(function(){ scrollToSel(w, d, '#sections', 140); }, 150);
    }}
  ];
  var wrap = document.getElementById('wrap');
  specs.forEach(function(s, i){
    var box = document.createElement('div'); box.className = 'box';
    var cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = s.cap;
    var f = document.createElement('iframe'); if (s.id) f.id = s.id;
    f.onload = function(){
      setTimeout(function(){
        try { s.fn(f.contentWindow, f.contentDocument); }
        catch (e) { cap.textContent += ' ERR:' + e.message; }
      }, 500);
    };
    f.src = './index.html?chk=d' + i + '&t=' + Date.now();
    box.appendChild(cap); box.appendChild(f); wrap.appendChild(box);
  });
</script>
</body>
</html>
