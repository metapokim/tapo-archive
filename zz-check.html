<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>임시 확인(390)</title>
<style>
  body{margin:0;background:#DDE3EA;font:12px/1.4 -apple-system,"Apple SD Gothic Neo",sans-serif}
  .wrap{display:flex;gap:16px;padding:12px;align-items:flex-start}
  .box{background:#fff;border-radius:12px;overflow:hidden}
  .cap{padding:5px 9px;font-weight:700;color:#334155;background:#F1F5F9}
  iframe{display:block;width:390px;border:0;height:560px}
  #c{height:360px}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
  try { localStorage.setItem('eunyu-archive-ui-v1', JSON.stringify({cat:'all', shelf:'all', sort:'default'})); } catch (e) {}

  function scrollToSel(w, d, sel, pad){
    var el = d.querySelector(sel);
    if (!el) return;
    var top = el.getBoundingClientRect().top + (d.documentElement.scrollTop || d.body.scrollTop || 0);
    w.scrollTo(0, Math.max(0, top - (pad || 70)));
  }

  var specs = [
    {cap:'390 · 전체(상단)', fn:null},
    {cap:'390 · 섹션 첫머리(1번 접음)', fn:function(w, d){
      scrollToSel(w, d, '#sections');
      setTimeout(function(){
        var t = d.querySelector('.sec .sec-toggle');
        if (t) t.click();
      }, 150);
    }},
    {cap:'390 · 푸터(백업·☁️·불러오기)', id:'c', fn:function(w, d){
      w.scrollTo(0, d.documentElement.scrollHeight);
    }}
  ];
  var wrap = document.getElementById('wrap');
  specs.forEach(function(s, i){
    var box = document.createElement('div'); box.className = 'box';
    var cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = s.cap;
    var f = document.createElement('iframe');
    if (s.id) f.id = s.id;
    f.onload = function(){
      setTimeout(function(){
        try { if (s.fn) s.fn(f.contentWindow, f.contentDocument); }
        catch (e) { cap.textContent += ' ERR:' + e.message; }
      }, 500);
    };
    f.src = './index.html?chk=' + i + '&t=' + Date.now();
    box.appendChild(cap); box.appendChild(f); wrap.appendChild(box);
  });
</script>
</body>
</html>
