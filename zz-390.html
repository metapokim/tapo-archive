<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390 확인</title>
<style>
  html,body{margin:0;padding:0;background:#D9D9DE;display:flex;justify-content:center}
  iframe{border:0;width:390px;height:900px;background:#fff}
</style>
</head>
<body>
<iframe id="f" src="./zz-preview.html"></iframe>
<script>
  var y = parseInt((location.search.match(/[?&]y=(\d+)/) || [0, 0])[1], 10);
  var f = document.getElementById('f');
  f.addEventListener('load', function(){
    try { f.contentWindow.scrollTo(0, y); } catch (e) {}
  });
</script>
</body>
</html>
