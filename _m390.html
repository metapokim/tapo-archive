<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow">
<title>390 검증 프레임 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#DADADD;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .wrap{width:390px;height:844px;margin:0;overflow:hidden}
  iframe{width:390px;height:844px;border:0;display:block;background:#fff}
</style></head>
<body>
  <div class="wrap"><iframe id="f" src="./index.html" title="TAPO's archive 390px"></iframe></div>
  <script>
  /* 검증용 임시 프레임: ?q=검색어 로 검색창을 채우고, ?sec=책 으로 그 섹션까지 스크롤한다. */
  (function(){
    var f = document.getElementById('f');
    var p = new URLSearchParams(location.search);
    var q = p.get('q') || '';
    var sec = p.get('sec') || '';
    function apply(){
      var d = f.contentDocument;
      if (!d) return;
      var box = d.getElementById('q');
      if (q && box) {
        box.value = q;
        box.dispatchEvent(new Event('input', { bubbles: true }));
      }
      setTimeout(function(){
        var d2 = f.contentDocument;
        var hs = d2.querySelectorAll('#main h2');
        for (var i = 0; i < hs.length; i++) {
          if (!sec || hs[i].textContent.trim() === sec) { hs[i].scrollIntoView(); return; }
        }
      }, 900);
    }
    if (f.contentDocument && f.contentDocument.readyState === 'complete') apply();
    f.addEventListener('load', apply);
  })();
  </script>
</body></html>
