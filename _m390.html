<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>390 preview</title>
<style>html,body{margin:0;background:#d4d4d8}iframe{display:block;margin:0;width:390px;height:900px;border:0;background:#fff}</style>
</head><body>
<iframe id="fr" src="./index.html"></iframe>
<script>
  var fr = document.getElementById('fr');
  fr.addEventListener('load', function(){
    var y = Number((location.search.match(/y=(\d+)/) || [])[1] || 0);
    try { fr.contentWindow.scrollTo(0, y); } catch (e) {}
  });
</script>
</body></html>
