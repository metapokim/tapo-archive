<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브리핑 수정 기능 테스트(임시)</title>
<style>
  body{margin:0;background:#111;color:#fff;font:14px/1.5 -apple-system,"Apple SD Gothic Neo",sans-serif}
  h2{font-size:14px;margin:14px 12px 6px}
  iframe{border:0;display:block;background:#fff}
  #d{width:100%;height:520px;border-bottom:2px solid #FFE600}
  #m{width:390px;height:844px;margin:0 12px;outline:2px solid #FFE600}
  pre{white-space:pre-wrap;margin:6px 12px 20px;font-size:12px;color:#9AE6B4}
</style>
</head>
<body>
<h2>1) 데스크톱(넓은 화면) — 두 번 클릭</h2>
<iframe id="d" src="_dbg.html?t=desk"></iframe>
<pre id="dr">대기…</pre>
<h2>2) 모바일 390×844 — 두 번 톡(300ms 안)</h2>
<iframe id="m" src="_dbg.html?t=mob"></iframe>
<pre id="mr">대기…</pre>
<script>
function frame(id){ return document.getElementById(id); }
function doc(id){ var f = frame(id); return f.contentDocument || f.contentWindow.document; }
function rowOf(d, n){ var r = d.querySelectorAll('.brief .brief-list > li'); return r[n] || null; }
function status(id, tag){
  var d = doc(id), li = rowOf(d, 1);
  return {
    tag: tag,
    input: !!(li && li.querySelector('.brief-edit-in')),
    value: li && li.querySelector('.brief-edit-in') ? li.querySelector('.brief-edit-in').value : null,
    bodyText: li && li.querySelector('.brief-body') ? li.querySelector('.brief-body').textContent : null,
    liClass: li ? li.className : null,
    edits: (function(){ try { return JSON.parse(d.defaultView.localStorage.getItem('eunyu-archive-v1') || '{}').brief || {}; } catch(e){ return String(e); } })()
  };
}
function report(id, obj){ document.getElementById(id).textContent = JSON.stringify(obj, null, 1); }

function mouseDbl(el){
  var r = el.getBoundingClientRect(), x = r.left + 20, y = r.top + r.height / 2;
  function fire(type, detail){
    el.dispatchEvent(new MouseEvent(type, {bubbles:true, cancelable:true, clientX:x, clientY:y, detail:detail, view:el.ownerDocument.defaultView}));
  }
  fire('mousedown', 1); fire('mouseup', 1); fire('click', 1);
  fire('mousedown', 2); fire('mouseup', 2); fire('click', 2);
  fire('dblclick', 2);
}
function touchSeq(el, done){
  var d = el.ownerDocument, w = d.defaultView;
  var r = el.getBoundingClientRect(), x = r.left + 20, y = r.top + r.height / 2;
  function ev(type){
    var t;
    try { t = new w.Touch({identifier: 1, target: el, clientX: x, clientY: y, pageX: x, pageY: y}); }
    catch(e){ return false; }
    var list = type === 'touchend' ? [] : [t];
    el.dispatchEvent(new w.TouchEvent(type, {bubbles:true, cancelable:true, touches:list, targetTouches:list, changedTouches:[t]}));
    return true;
  }
  if (!ev('touchstart')) { done(false); return; }
  ev('touchend');
  setTimeout(function(){ ev('touchstart'); ev('touchend'); done(true); }, 120);
}

function run(){
  var el = rowOf(doc('d'), 1);
  if (!el) { report('dr', {error:'row not found'}); return; }
  mouseDbl(el);
  setTimeout(function(){ report('dr', status('d', 'desktop dblclick')); }, 250);

  var el2 = rowOf(doc('m'), 1);
  if (!el2) { report('mr', {error:'row not found'}); return; }
  touchSeq(el2, function(ok){
    setTimeout(function(){ var s = status('m', 'mobile double tap'); s.touchSupported = ok; report('mr', s); }, 250);
  });
}
setTimeout(run, 1600);
window.__harness = {
  state: function(id){ return status(id, 'read'); },
  save: function(id, text){
    var d = doc(id), li = rowOf(d, 1), inp = li && li.querySelector('.brief-edit-in');
    if (!inp) return {error:'no input'};
    inp.value = text;
    inp.dispatchEvent(new d.defaultView.Event('input', {bubbles:true}));
    inp.dispatchEvent(new d.defaultView.KeyboardEvent('keydown', {key:'Enter', bubbles:true, cancelable:true}));
    return {ok:true};
  }
};
</script>
</body>
</html>
