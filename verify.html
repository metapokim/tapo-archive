<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>메모 연결 동그라미 검증 (임시)</title>
<style>
  html,body{margin:0;background:#E7E7EA;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}
  .wrap{display:flex;gap:24px;padding:18px;align-items:flex-start}
  .phone{width:390px;height:844px;border:10px solid #18181B;border-radius:44px;overflow:hidden;background:#fff;position:relative;flex:0 0 auto}
  .phone iframe{width:390px;height:844px;border:0;display:block}
  .cap{font-size:12px;color:#52525B;margin:6px 0 0 2px}
  .col{display:flex;flex-direction:column}
  .wide{width:1040px;border:6px solid #18181B;border-radius:16px;overflow:hidden;background:#fff;flex:0 0 auto}
  .wide iframe{width:1040px;height:800px;border:0;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="col">
    <div class="phone" id="p1"><iframe id="f1" src="index.html" title="모바일 390 메모 탭"></iframe></div>
    <p class="cap">390 × 844 · 메모 탭</p>
  </div>
</div>
<script>
  /* 촬영용 — 지정한 카드의 하단(foot)이 화면 가운데 오도록 안쪽 화면만 스크롤한다.
     사이트의 상태나 데이터는 건드리지 않는다. */
  (function(){
    var q = new URLSearchParams(location.search), focus = q.get('focus');
    var frame = document.getElementById('f1');
    if (!frame || !focus) return;
    frame.addEventListener('load', function(){
      try {
        var d = frame.contentDocument;
        var card = d.querySelector('.card[data-id="' + focus + '"]');
        var foot = card && card.querySelector('.card-foot');
        if (foot) foot.scrollIntoView({ block: 'center' });
        else if (card) card.scrollIntoView({ block: 'center' });
      } catch (e) {}
    });
  })();
</script>
</body>
</html>
