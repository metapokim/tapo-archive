<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>확인용 임시 페이지 (확인 후 삭제)</title>
<body style="font:13px/1.6 system-ui,-apple-system,sans-serif;padding:16px">
<pre id="out">…</pre>
<script>
(function(){
  var q = new URLSearchParams(location.search), m = q.get('m');
  var out = document.getElementById('out');
  var STORE = 'eunyu-archive-v1', UI = 'eunyu-archive-ui-v1', SYNC = 'eunyu-archive-sync-v1';
  function cfg(){ try { return JSON.parse(localStorage.getItem(SYNC) || 'null'); } catch (e) { return null; } }

  /* m=seed : 옛 sub + ynaSynced20261116=1 인 기기 상태를 심고 아카이브로 이동 */
  if (m === 'seed') {
    var c = cfg();
    if (c && c.token) { out.textContent = 'SYNC CONFIGURED — 실제 Gist 로 나갈 수 있어 시드를 중단했습니다.'; return; }
    var item = {
      id: 'n20260610_yna', cat: 'news', kind: '기사',
      title: '"동성부부도 법적 보호 대상"…법원, 파탄책임 1천만원 위자료',
      publisher: '연합뉴스', date: '2026-06-10',
      sub: '서울중앙지법 2025나10110 (확정)',
      status: '읽음', memo: '기존 메모 보존 확인',
      summary: '판결 요지 테스트', updatedAt: '2026-11-16T10:00:00.000Z'
    };
    localStorage.setItem(STORE, JSON.stringify({
      v: 1, savedAt: '2026-11-16T10:00:00.000Z',
      items: [item], deleted: ['doc20260605_2025na10110'], brief: {}
    }));
    localStorage.setItem(UI, JSON.stringify({
      cat: 'news', shelf: 'all', sort: 'default',
      bjSynced20261115: 1, forumSynced20261116: 1, forumPoster20261116: 1,
      shelfCart20261116: 1, ynaSynced20261116: 1
    }));
    out.textContent = '심음 — 잠시 뒤 아카이브로 이동합니다.';
    setTimeout(function(){ location.replace('index.html?v=' + Date.now()); }, 900);
    return;
  }

  /* m=dump : 아카이브가 저장한 값을 그대로 보여 준다 */
  if (m === 'dump') {
    var s = null, u = null;
    try { s = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
    try { u = JSON.parse(localStorage.getItem(UI) || 'null'); } catch (e) {}
    var items = (s && s.items) || [];
    var it = null, k;
    for (k = 0; k < items.length; k++) { if (items[k].id === 'n20260610_yna') { it = items[k]; break; } }
    out.textContent = JSON.stringify({
      sub: it && it.sub,
      memo: it && it.memo,
      status: it && it.status,
      updatedAt: it && it.updatedAt,
      itemCount: items.length,
      ui: u
    }, null, 2);
    return;
  }

  /* m=reset : 확인용으로 심은 값을 지워 새 기기 상태(기준 데이터)로 되돌린다 */
  if (m === 'reset') {
    var c2 = cfg();
    if (c2 && c2.token) { out.textContent = 'SYNC CONFIGURED — 되돌리기를 중단했습니다.'; return; }
    localStorage.removeItem(STORE);
    localStorage.removeItem(UI);
    out.textContent = '지움 — 잠시 뒤 아카이브로 이동합니다.';
    setTimeout(function(){ location.replace('index.html?v=' + Date.now()); }, 900);
    return;
  }

  out.textContent = '?m=seed | ?m=dump | ?m=reset';
})();
</script>
