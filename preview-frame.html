<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>preview</title>
<style>html,body{margin:0;padding:0;background:#E4E4E7;overflow:hidden}
#wrap{transform-origin:top left;position:absolute;left:0;top:0}
iframe{border:0;display:block;background:#fff}</style>
</head><body>
<div id="wrap"><iframe id="f" src="./index.html" width="1280" height="900"></iframe></div>
<script>
var q = new URLSearchParams(location.search);
var w = Number(q.get('w') || 1280), h = Number(q.get('h') || 900), s = Number(q.get('s') || 1);
var f = document.getElementById('f'); f.width = w; f.height = h;
var cb = q.get('cb'); if (cb) f.src = './index.html?cb=' + cb;
document.getElementById('wrap').style.transform = 'scale(' + s + ')';
</script>
</body></html>
